<style>
    :root {
        --srl-color-tu: #4fc99b;
        --srl-color-media: #c9c9c9;
        --srl-color-primary: #005696;
        --srl-border: #e1e1e1;
        --srl-bg-panel: #f9f9f9;
        --srl-radius: 8px;
        --srl-gap: 20px;
    }

    html { scroll-behavior: smooth; }
    .content-wrapper { padding: 0px; }
    .window-wrap { margin-top: -20px; }
    .wrapper-course-material .course-tabs { padding: 0 20px 10px; }
    
    #main {
        border: 1px solid #c8c8c8;
        margin: -11px 20px 10px;
        padding: 2em; 
        background-color: #ffffff;
    }

    .srl-dashboard-wrapper {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 20px;
    }

    /* resumen */
    .srl-summary {
        background: #fff;
        border: 1px solid var(--srl-border);
        border-radius: var(--srl-radius);
        padding: 1.25em 1.5em;
        margin-bottom: var(--srl-gap);
    }
    .summary-header {
        display: flex;
        align-items: baseline;
        gap: 0.5em;
        margin-bottom: 0.5em;
    }
    .srl-summary h3 { margin: 0 0 0.3em; font-size: 1.1em; }
    .summary-date { color: #777; font-size: 0.85em; margin-left: 0.5em; }
    .summary-text { margin: 0.6em 0; line-height: 1.5; }
    .srl-summary[data-collapsed="true"] .summary-full { display: none; }
    .srl-summary[data-collapsed="true"] .summary-short { display: inline; }
    .srl-summary[data-collapsed="false"] .summary-short { display: none; }
    .srl-summary[data-collapsed="false"] .summary-full { display: inline; }
    
    .toggle-summary {
        background: none;
        border: none;
        color: var(--srl-color-primary);
        cursor: pointer;
        font-size: 0.9em;
        font-weight: 600;
        padding: 0;
        margin-top: 0.5em;
        display: inline-flex;
        align-items: center;
        gap: 0.3em;
    }
    .toggle-summary:hover { text-decoration: underline; }

    .tip-ils {
        margin-top: 1em; 
        padding-top: 0.8em;
        border-top: 1px solid #f0f0f0;
        color: #555; 
        font-size: 0.9em;
    }

    /* barra de métricas */
    .srl-metrics-bar {
        position: relative;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 1.5em;
        background: #fff;
        border: 1px solid var(--srl-border);
        border-radius: var(--srl-radius);
        padding: 24px 32px;
        margin-bottom: 1em;
    }
    .metric-item {
        display: flex;
        align-items: center;
        gap: 0.6em;
        flex: 1 1 auto;
        min-width: 140px;
    }
    .metric-value {
        font-size: 1.75em;
        font-weight: 700;
        color: #222;
        line-height: 1;
        margin: 0;
    }
    .metric-details {
        display: flex;
        flex-direction: column;
        justify-content: center;
        max-width: 120px;
    }
    .metric-label {
        font-size: 0.75em;
        font-weight: 600;
        text-transform: uppercase;
        color: #666;
        letter-spacing: 0.02em;
        line-height: 1.25;
        white-space: normal;
        word-break: break-word;
    }

    /* tooltip de barra de métricas */
    .metrics-info-container {
        position: absolute;
        top: 10px;
        right: 12px;
        z-index: 10;
    }
    .metrics-info-container .tooltip-trigger {
        background: none;
        border: none;
        cursor: pointer;
        color: #888;
        font-size: 1em;
        padding: 2px 6px;
        border-radius: 50%;
        line-height: 1;
        transition: color 0.2s ease, background-color 0.2s ease;
    }
    .metrics-info-container .tooltip-trigger:hover,
    .metrics-info-container .tooltip-trigger:focus {
        color: var(--srl-color-primary);
        background-color: #f0f4f8;
        outline: none;
    }
    .metrics-info-container .tooltip-box {
        visibility: hidden;
        opacity: 0;
        position: absolute;
        top: 125%;
        right: 0;
        width: 280px;
        background: #2a2a2a;
        color: #fff;
        border-radius: 6px;
        padding: 0.8em 1em;
        font-size: 0.78em;
        line-height: 1.4;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
        z-index: 1000;
        transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
        transform: translateY(-4px);
        pointer-events: none;
    }
    .metrics-info-container .tooltip-box::after {
        content: "";
        position: absolute;
        bottom: 100%;
        right: 10px;
        border-width: 5px;
        border-style: solid;
        border-color: transparent transparent #2a2a2a transparent;
    }
    .metrics-info-container:hover .tooltip-box,
    .metrics-info-container .tooltip-trigger:focus + .tooltip-box {
        visibility: visible;
        opacity: 1;
        transform: translateY(0);
    }
    .metrics-info-list {
        margin: 0.4em 0 0;
        padding-left: 1.1em;
    }
    .metrics-info-list li { margin-bottom: 0.4em; }
    .metrics-info-list li:last-child { margin-bottom: 0; }

    /* contenedoress */
    .srl-charts-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--srl-gap);
    }
    .chart-panel {
        background: #fff;
        border: 1px solid var(--srl-border);
        border-radius: var(--srl-radius);
        padding: 1.25em 1.5em 1.5em;
        min-width: 0;
    }
    .chart-panel h4 {
        display: flex;
        align-items: center;
        gap: 0.4em;
        font-size: 1em;
        letter-spacing: 0.03em;
        margin: 0 0 1em;
        text-transform: uppercase;
    }
    .chart-legend {
        display: flex;
        gap: 1.5em;
        justify-content: flex-end;
        margin-bottom: 0.5em;
        font-size: 0.85em;
        color: #555;
    }
    .legend-item { display: flex; align-items: center; gap: 0.4em; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot-tu { background: var(--srl-color-tu); }
    .dot-media { background: var(--srl-color-media); }

    .chart-scroll-wrap {
        position: relative;
        height: 280px;
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        scroll-snap-type: x proximity;
    }
    .chart-panel canvas { max-height: 280px; }

    .chart-toggle {
        display: inline-flex;
        border: 1px solid var(--srl-border);
        border-radius: 20px;
        overflow: hidden;
        margin-bottom: 1em;
        float: right;
    }
    .chart-toggle .toggle-btn {
        border: none;
        background: #f2f2f2;
        padding: 0.35em 1em;
        font-size: 0.8em;
        cursor: pointer;
        color: #555;
    }
    .chart-toggle .toggle-btn.active {
        background: var(--srl-color-primary);
        color: #fff;
    }

    /* recomendaciones */
    .recommendations-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1.25em;
        margin-top: 1em;
    }
    .recommendation-card {
        background: #fff;
        border: 1px solid var(--srl-border);
        border-left: 4px solid var(--srl-color-primary);
        border-radius: var(--srl-radius);
        padding: 1.2em;
        box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .recommendation-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    .rec-card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 0.8em;
        margin-bottom: 0.6em;
    }
    .recommendation-card h4 { margin: 0; font-size: 1em; color: #222; }
    .rec-category {
        font-size: 0.7em;
        font-weight: 700;
        text-transform: uppercase;
        background: #f0f4f8;
        color: var(--srl-color-primary);
        padding: 0.2em 0.6em;
        border-radius: 12px;
        white-space: nowrap;
    }
    .recommendation-card p {
        margin: 0;
        font-size: 0.88em;
        color: #555;
        line-height: 1.45;
    }

    .srl-profile, .srl-recommendations {
        margin-bottom: 2em;
        padding-bottom: 1.5em;
        border-bottom: 1px solid #f0f0f0;
    }
    .profile-dimensions {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin-top: 15px;
    }
    .dimension-card {
        background: #f9f9f9;
        border: 1px solid var(--srl-border);
        padding: 15px;
        border-radius: 4px;
        flex: 1 1 calc(33.333% - 15px);
        min-width: 200px;
    }

    .srl-footer {
        text-align: right;
        color: #999;
        font-size: 0.8em;
        margin-top: 1.5em;
    }

    @media (max-width: 1024px) {
        .srl-charts-grid { grid-template-columns: 1fr; }
        .srl-metrics-bar { justify-content: flex-start; }
        .metric-item { flex: 1 1 30%; }
    }

    @media (max-width: 600px) {
        .srl-dashboard-wrapper { padding: 0 12px; }
        .srl-metrics-bar { gap: 1em; }
        .metric-item { flex: 1 1 45%; min-width: 0; }
        .metric-value { font-size: 1.3em; display: block; }
        .chart-legend { justify-content: flex-start; }
        .chart-panel { padding: 1em; }
        .chart-panel h4 { font-size: 0.9em; }
        .chart-scroll-wrap canvas { min-width: 500px; }
        .chart-toggle { float: none; display: flex; margin-bottom: 0.8em; }
    }
    @media (max-width: 768px) {
        .chart-toggle, 
        .toggle-buttons {
            display: flex;
            width: 100%;
            flex-wrap: wrap; 
            gap: 4px;
            margin-bottom: 16px;
        }
        .chart-toggle .toggle-btn, 
        .toggle-buttons button {
            flex: 1 1 auto;
            min-width: 80px;
            font-size: 11px;
            padding: 8px 4px;
            text-align: center;
            white-space: nowrap; 
            overflow: hidden;
            text-overflow: ellipsis;
        }
    }
    .srl-charts-wrapper {
        display: flex;
        flex-direction: column;
        gap: 48px;
        margin-top: 32px;
        margin-bottom: 32px;
    }
    .chart-scroll-wrapper {
        width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        padding-bottom: 12px;
        box-shadow: inset -15px 0 15px -15px rgba(0,0,0,0.1);
    }
    .chart-scroll-wrapper::-webkit-scrollbar {
        height: 8px;
    }
    .chart-scroll-wrapper::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 4px;
    }
    .chart-scroll-wrapper::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
    }
    .chart-scroll-wrapper::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
    }
</style>
