<script>

    'use strict';

    var globalD3 = null;
    var currentCompletitudView = 'chapter';
    var currentNavigationView = 'chapter';
    var currentEvaluacionesView = 'calificaciones';
    var currentVideoView = 'porcentaje';

    // ==========================================

    // ==========================================
    var MOCK_COMPLETITUD = {

            { name: 'Módulo 1:', individual_time: 100, average_time: 100 }, { name: 'Módulo 2:', individual_time: 100, average_time: 95 },

    var MOCK_NAVEGACION = {
        chapter: [
            { name: 'Módulo 1: Bienvenida', individual_time: 240, average_time: 210 }, { name: 'Módulo 2: Introducción', individual_time: 180, average_time: 190 },
            { name: 'Módulo 3: Desarrollo', individual_time: 120, average_time: 115 }, { name: 'Módulo 4: Conclusión', individual_time: 120, average_time: 135 },
            { name: 'Módulo 5: Evaluación', individual_time: 120, average_time: 125 }, { name: 'Módulo 6: Retroalimentación', individual_time: 180, average_time: 190 },
            { name: 'Módulo 7: Resumen', individual_time: 120, average_time: 100 }, { name: 'Módulo 8: Aplicación', individual_time: 175, average_time: 175 },
            { name: 'Módulo 9: Evaluación', individual_time: 120, average_time: 110 }, { name: 'Módulo 10: Cierre', individual_time: 180, average_time: 150 },
            { name: 'Módulo 11: Reforzamiento', individual_time: 240, average_time: 230 }, { name: 'Módulo 12: Avance', individual_time: 180, average_time: 210 },
            { name: 'Módulo 13: Práctica', individual_time: 120, average_time: 130 }, { name: 'Módulo 14: Evaluación Final', individual_time: 180, average_time: 200 }
        ],
        week: [
            { week: 1, date_label: 'Lunes 07 de Sept', individual_time: 120, average_time: 140 },
            { week: 2, date_label: 'Lunes 14 de Sept', individual_time: 180, average_time: 160 },
            { week: 3, date_label: 'Lunes 21 de Sept', individual_time: 210, average_time: 180 },
            { week: 4, date_label: 'Lunes 28 de Sept', individual_time: 90, average_time: 150 },
            { week: 5, date_label: 'Lunes 05 de Oct', individual_time: 240, average_time: 200 }
        ]
    };

    var MOCK_VIDEOS = [
        { title: "Módulo 1 - Introducción", progress_user: 98, progress_median: 100, time_user: 3.4, time_median: 3.45, time_total: 3.5, videos_count: 2, items: [ { title: "1.1 - Bienvenida", progress_user: 100, progress_median: 100, inter_user: 5, inter_median: 6, time_user: 0.5, time_median: 0.5, time_total: 0.5 }, { title: "1.2 - Objetivos", progress_user: 85, progress_median: 90, inter_user: 3, inter_median: 3, time_user: 2.8, time_median: 2.9, time_total: 3 } ] },
        { title: "Módulo 2 - Tema 1", progress_user: 75, progress_median: 80, time_user: 3.0, time_median: 3.2, time_total: 4.0, videos_count: 5, items: [ { title: "2.1 - Conceptos", progress_user: 100, progress_median: 90, inter_user: 4, inter_median: 4, time_user: 1.0, time_median: 0.9, time_total: 1.0 }, { title: "2.2 - Ejemplos", progress_user: 50, progress_median: 70, inter_user: 1, inter_median: 3, time_user: 1.5, time_median: 2.1, time_total: 3.0 } ] },
        { title: "Módulo 3 - Tema 2", progress_user: 40, progress_median: 60, time_user: 2.0, time_median: 3.0, time_total: 5.0, videos_count: 7, items: [ {title: "3.1 - Introducción", progress_user: 30, progress_median: 50, inter_user: 2, inter_median: 3, time_user: 0.3, time_median: 0.5, time_total: 1.0 } ] }
    ];

    var MOCK_EVALUACIONES_TIEMPO = [
        { name: 'Quiz 1', short_label: 'Q1', min: 1.3, q1: 1.8, median: 2.4, q3: 3.0, max: 3.6, time_user: 2.7 },
        { name: 'Quiz 2', short_label: 'Q2', min: 1.0, q1: 1.4, median: 2.3, q3: 3.5, max: 3.9, time_user: 2.4 },
        { name: 'Quiz 3', short_label: 'Q3', min: 1.4, q1: 1.8, median: 2.5, q3: 3.2, max: 3.7, time_user: 2.8 },
        { name: 'Tarea 1', short_label: 'T1', min: 0.9, q1: 1.5, median: 2.2, q3: 2.9, max: 3.5, time_user: 2.0 },
        { name: 'Tarea 2', short_label: 'T2', min: 1.5, q1: 2.0, median: 2.5, q3: 3.1, max: 3.6, time_user: 2.7 },
        { name: 'Quiz 4', short_label: 'Q4', min: 0.6, q1: 1.2, median: 1.7, q3: 2.3, max: 2.9, time_user: 1.8 },
        { name: 'Quiz 5', short_label: 'Q5', min: 0.3, q1: 1.0, median: 1.5, q3: 2.0, max: 2.6, time_user: 1.9 }
    ];

    // ==========================================
    // 2. Tooltips & Recomendaciones
    // ==========================================
    var globalTooltipEl = null;
    function getTooltip() {
        if (!globalTooltipEl) {
            globalTooltipEl = document.createElement('div');
            globalTooltipEl.className = 'd3-tooltip';
            document.body.appendChild(globalTooltipEl);
        }
        return globalTooltipEl;
    }
    
    function showTooltip(e, html) {
        var t = getTooltip();
        t.innerHTML = html;
        t.style.opacity = 1;
        moveTooltip(e);
    }
    
    function moveTooltip(e) {
        var pageX = e.pageX || (e.touches && e.touches[0].pageX) || 0;
        var pageY = e.pageY || (e.touches && e.touches[0].pageY) || 0;
        var t = getTooltip();
        t.style.left = (pageX > window.innerWidth - 150 ? pageX - 120 : pageX + 15) + 'px';
        t.style.top = (pageY - 30) + 'px';
    }
    
    function hideTooltip() { if(globalTooltipEl) globalTooltipEl.style.opacity = 0; }

    function applyRecommendationCollapse(contentId, btnId) {
        var content = document.getElementById(contentId);
        var btn = document.getElementById(btnId);
        if (!content || !btn) return;
        var text = content.textContent.trim();
        
        if (text.length > 90 && text !== 'Cargando recomendación...') {
            content.classList.add('collapsed');
            content.style.maxHeight = '26px';
            btn.style.display = 'inline-block';
            btn.textContent = 'Ver más';
        } else {
            content.classList.remove('collapsed');
            content.style.maxHeight = 'none';
            btn.style.display = 'none';
        }
    }

    function toggleRec(contentId, btnId) {
        var content = document.getElementById(contentId);
        var btn = document.getElementById(btnId);
        if (!content || !btn) return;
        var isCollapsed = content.classList.contains('collapsed');
        content.classList.toggle('collapsed');
        content.style.maxHeight = isCollapsed ? content.scrollHeight + 'px' : '26px';
        btn.textContent = isCollapsed ? 'Ver menos' : 'Ver más';
    }

    // Funciones onclick del HTML
    window.toggleRecommendationText = function() { toggleRec('rec-content', 'rec-toggle-btn'); };
    window.toggleVideosRecommendationText = function() { toggleRec('rec-videos-content', 'rec-videos-toggle-btn'); };
    window.toggleEvalRecommendationText = function() { toggleRec('rec-eval-content', 'rec-eval-toggle-btn'); };


    // ==========================================
    // 3. Inicialiacion
    // ==========================================
    import('https://cdn.jsdelivr.net/npm/d3@7/+esm').then(function (d3Module) {
        globalD3 = d3Module;
        renderChart(globalD3, 'completitud', currentCompletitudView);
        renderChart(globalD3, 'navigation', currentNavigationView);
        renderEvaluacionesChart(globalD3, currentEvaluacionesView);
        renderVideosChart();
        setupToggles(globalD3);
    }).catch(function (error) {
        console.error('No se pudo cargar D3:', error);
    });

    // Formateadores de texto
    function getXLabel(d, view) {
        if (view === 'week') return d.date_label || ('Semana ' + d.week);
        var match = d.name.match(/^Módulo (\d+)/i);
        return match ? ('Mód. ' + match[1]) : d.name;
    }

    function formatTime(minutes) {
        if (!minutes) return '0 min';
        minutes = Math.round(minutes);
        var hours = Math.floor(minutes / 60);
        var remainingMinutes = minutes % 60;
        if (hours > 0) return remainingMinutes === 0 ? hours + 'h' : hours + 'h ' + remainingMinutes + 'min';
        return minutes + ' min';
    }


    // ==========================================
    // 4. Graficos: Completitu Acumulada y Tiempo de Navegacion
    // ==========================================
    function renderChart(d3, chartType, view) {
        var containerId = chartType === 'completitud' ? 'completitud-chart' : 'navigation-chart';
        var container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';

        var data = chartType === 'completitud' ? MOCK_COMPLETITUD[view] : MOCK_NAVEGACION[view];
        var margin = { top: 20, right: 20, bottom: view === 'chapter' ? 80 : 60, left: 60 };
        var height = 200;
        
        var parentWidth = container.parentElement.clientWidth || 800;
        var idealMinWidth = (view === 'chapter') ? data.length * 60 : data.length * 80;
        var containerWidth = Math.max(parentWidth, idealMinWidth);
        var width = containerWidth - margin.left - margin.right;

        var svg = d3.select('#' + containerId).append('svg')
            .attr('width', containerWidth)
            .attr('height', height + margin.top + margin.bottom);

        var chart = svg.append('g').attr('transform', 'translate(' + margin.left + ',' + margin.top + ')');

        var labels = data.map(function (d) { return getXLabel(d, view); });
        var x = d3.scaleBand().domain(labels).range([0, width]).padding(0.2);

        var isCompletitud = chartType === 'completitud';
        var maxValue = isCompletitud ? 100 : d3.max(data, function(d) { return Math.max(d.individual_time, d.average_time) / 60; }) * 1.15;
        var yAxisLabel = isCompletitud ? 'AVANCE (%)' : 'TIEMPO (H)';
        var colorBarra = isCompletitud ? 'completitud-bar' : 'navigation-bar';
        var lineColor = isCompletitud ? '#00a676' : '#087db2';
        
        var y = d3.scaleLinear().domain([0, maxValue]).nice().range([height, 0]);

        // Dibujar Ejes y Grilla
        chart.append('g').attr('class', 'grid')
            .call(d3.axisLeft(y).ticks(5).tickSize(-width).tickFormat(''))
            .selectAll('line').style('stroke', '#eef2f5').style('stroke-opacity', '0.7');
        chart.selectAll('.grid path').style('stroke-width', '0');

        chart.append('g').attr('class', 'chart-axis')
            .call(d3.axisLeft(y).ticks(5).tickFormat(function (d) { return isCompletitud ? d : d.toFixed(1); }));

        chart.append('g').attr('class', 'chart-axis')
            .attr('transform', 'translate(0,' + height + ')')
            .call(d3.axisBottom(x));

        chart.append('text').attr('transform', 'rotate(-90)').attr('y', -margin.left + 15).attr('x', -height / 2)
            .attr('dy', '1em').style('text-anchor', 'middle').style('font-size', '11px').style('fill', '#666').text(yAxisLabel);

        // Generador de HTML para Tooltip
        function getTooltipHtml(d) {
            var label = view === 'week' ? (d.date_label || 'Semana ' + d.week) : d.name;
            var valTu = isCompletitud ? d.individual_time + '%' : formatTime(d.individual_time);
            var valMedia = isCompletitud ? d.average_time + '%' : formatTime(d.average_time);
            return '<strong>' + label + '</strong><br>Tú: ' + valTu + '<br>Mediana del curso: ' + valMedia;
        }

        if (view === 'week') {
            var lineTu = d3.line().x(function (d) { return x(getXLabel(d, view)) + x.bandwidth() / 2; })
                .y(function (d) { return isCompletitud ? y(d.individual_time) : y(d.individual_time / 60); });

            var lineMedia = d3.line().x(function (d) { return x(getXLabel(d, view)) + x.bandwidth() / 2; })
                .y(function (d) { return isCompletitud ? y(d.average_time) : y(d.average_time / 60); });

            if (isCompletitud) {
                var areaMediana = d3.area().x(function (d) { return x(getXLabel(d, view)) + x.bandwidth() / 2; }).y0(height).y1(function (d) { return y(d.average_time); });
                var areaTu = d3.area().x(function (d) { return x(getXLabel(d, view)) + x.bandwidth() / 2; }).y0(height).y1(function (d) { return y(d.individual_time); });

                chart.append('path').datum(data).attr('fill', '#5d5d5d').attr('fill-opacity', 0.15).attr('d', areaMediana).style('pointer-events', 'none');
                chart.append('path').datum(data).attr('fill', lineColor).attr('fill-opacity', 0.15).attr('d', areaTu).style('pointer-events', 'none');
            }

            chart.append('path').datum(data).attr('fill', 'none').attr('stroke', '#5d5d5d').attr('stroke-width', 2).attr('stroke-dasharray', '5,5').attr('d', lineMedia);
            chart.append('path').datum(data).attr('fill', 'none').attr('stroke', lineColor).attr('stroke-width', 3).attr('d', lineTu);

            chart.selectAll('.dot-punto').data(data).enter().append('circle')
                .attr('cx', function (d) { return x(getXLabel(d, view)) + x.bandwidth() / 2; })
                .attr('cy', function (d) { return isCompletitud ? y(d.individual_time) : y(d.individual_time / 60); })
                .attr('r', 8).attr('fill', lineColor).style('cursor', 'pointer')
                .on('mouseover touchstart', function(e, d) { showTooltip(e, getTooltipHtml(d)); })
                .on('mousemove touchmove', moveTooltip)
                .on('mouseout touchend', hideTooltip);
        } else {
            chart.selectAll('.' + colorBarra).data(data).enter().append('rect')
                .attr('class', colorBarra)
                .attr('x', function (d) { return x(getXLabel(d, view)); })
                .attr('y', function (d) { return isCompletitud ? y(d.individual_time) : y(d.individual_time / 60); })
                .attr('width', x.bandwidth())
                .attr('height', function (d) { return height - (isCompletitud ? y(d.individual_time) : y(d.individual_time / 60)); })
                .attr('rx', 1).style('cursor', 'pointer')
                .on('mouseover touchstart', function(e, d) { showTooltip(e, getTooltipHtml(d)); })
                .on('mousemove touchmove', moveTooltip)
                .on('mouseout touchend', hideTooltip);

            chart.selectAll('.chart-average').data(data).enter().append('rect')
                .attr('class', 'chart-average')
                .attr('x', function (d) { return x(getXLabel(d, view)) - 2; })
                .attr('y', function (d) { return (isCompletitud ? y(d.average_time) : y(d.average_time / 60)) - 3; })
                .attr('width', x.bandwidth() + 4).attr('height', 6).attr('rx', 2).style('pointer-events', 'none');
        }

        // Recomendacion
        var recElement = document.getElementById('rec-text-content');
        if (recElement) {
            var firstName = (typeof userNameActual !== 'undefined' && userNameActual) ? userNameActual.split(' ')[0] : 'Estudiante';
            recElement.textContent = '¡Hola, ' + firstName + '! El sistema registró que las unidades que has completado hasta esta semana están en la mediana de tu curso y el tiempo que has pasado en la plataforma está por sobre la mediana del que ha destinado tu curso. Te recomendamos mantener este ritmo de estudio.';
            applyRecommendationCollapse('rec-content', 'rec-toggle-btn');
        }
    }


    // ==========================================
    // 5. Grafico: Visualizacion de Videos
    // ==========================================
    function renderVideosChart() {
        var container = document.getElementById('videos-accordion-container');
        if (!container) return;

        var htmlString = '';
        var chevronSvg = '<svg class="chevron-icon" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>';
        var isTime = currentVideoView === 'tiempo';

        MOCK_VIDEOS.forEach(function(modulo, index) {
            var isOpen = index === 0 ? 'open' : '';
            var valUser = isTime ? modulo.time_user : modulo.progress_user;
            var valMedia = isTime ? modulo.time_median : modulo.progress_median;
            var valMax = isTime ? modulo.time_total : 100;
            
            var widthUserPct = Math.min((valUser / valMax) * 100, 100);
            var leftMediaPct = Math.min((valMedia / valMax) * 100, 100);
            var labelLeft = isTime ? '0H' : '0%';
            var labelRight = isTime ? valMax + 'H' : '100%';
            var formatSuffix = isTime ? 'H' : '%';

            htmlString += '<details class="video-module-details" ' + isOpen + '>';
            htmlString += '<summary class="video-module-summary">' + chevronSvg;
            htmlString += '<div class="video-title">' + modulo.title + '</div>';
            htmlString += '<div class="video-bar-wrapper">';
            htmlString += '  <div class="video-bar-bg tooltip-target" data-name="' + modulo.title + '" data-tu="' + valUser + formatSuffix + '" data-media="' + valMedia + formatSuffix + '">';
            htmlString += '    <div class="video-bar-fill" style="width: ' + widthUserPct + '%;"></div>';
            htmlString += '    <div class="video-median-marker" style="left: ' + leftMediaPct + '%;"></div>';
            htmlString += '  </div>';
            htmlString += '  <div class="video-bar-labels"><span>' + labelLeft + '</span><span>' + labelRight + '</span></div>';
            htmlString += '</div><div class="video-meta">(' + modulo.videos_count + ' videos)</div></summary>';
            
            if (modulo.items && modulo.items.length > 0) {
                htmlString += '<div class="video-items-list">';
                modulo.items.forEach(function(video) {
                    var vUser = isTime ? video.time_user : video.progress_user;
                    var vMedia = isTime ? video.time_median : video.progress_median;
                    var vMax = isTime ? video.time_total : 100;
                    var vWidthUser = Math.min((vUser / vMax) * 100, 100);
                    var vLeftMedia = Math.min((vMedia / vMax) * 100, 100);

                    htmlString += '<div class="video-item-row"><div class="video-title">' + video.title + '</div>';
                    htmlString += '  <div class="video-bar-wrapper">';
                    htmlString += '    <div class="video-bar-bg tooltip-target" data-name="' + video.title + '" data-tu="' + vUser + formatSuffix + '" data-media="' + vMedia + formatSuffix + '">';
                    htmlString += '      <div class="video-bar-fill" style="width: ' + vWidthUser + '%;"></div>';
                    htmlString += '      <div class="video-median-marker" style="left: ' + vLeftMedia + '%;"></div>';
                    htmlString += '    </div><div class="video-bar-labels"><span>' + labelLeft + '</span><span>' + (isTime ? vMax + 'H' : '100%') + '</span></div>';
                    htmlString += '  </div><div class="video-meta">Interacciones: ' + video.inter_user + ' Mediana: ' + video.inter_median + '</div></div>';
                });
                htmlString += '</div>';
            }
            htmlString += '</details>';
        });

        container.innerHTML = htmlString;
        
        // Atar eventos de tooltip a los elementos inyectados
        document.querySelectorAll('#videos-accordion-container .tooltip-target').forEach(function(target) {
            function handleHover(e) {
                var html = '<strong>' + target.getAttribute('data-name') + '</strong><br>Tú: ' + target.getAttribute('data-tu') + '<br>Mediana del curso: ' + target.getAttribute('data-media');
                showTooltip(e, html);
            }
            target.addEventListener('mouseover', handleHover);
            target.addEventListener('touchstart', function(e) { handleHover(e.touches[0]); });
            target.addEventListener('mousemove', moveTooltip);
            target.addEventListener('touchmove', function(e) { moveTooltip(e.touches[0]); });
            target.addEventListener('mouseout', hideTooltip);
            target.addEventListener('touchend', hideTooltip);
        });

        applyRecommendationCollapse('rec-videos-content', 'rec-videos-toggle-btn');
    }

    window.setVideoViewMode = function(mode) {
        currentVideoView = mode;
        var btnPorcentaje = document.getElementById('btn-view-porcentaje');
        var btnTiempo = document.getElementById('btn-view-tiempo');
        if (btnPorcentaje && btnTiempo) {
            btnPorcentaje.classList.toggle('active', mode === 'porcentaje');
            btnTiempo.classList.toggle('active', mode === 'tiempo');
        }
        renderVideosChart();
    };


    // ==========================================
    // 6. Grafico: Evaluaciones
    // ==========================================
    function renderEvaluacionesChart(d3, view) {
        var container = document.getElementById('evaluaciones-chart');
        if (!container) return;
        container.innerHTML = '';

        var dataCalificaciones = (typeof evaluacionesData !== 'undefined' && evaluacionesData) ? evaluacionesData : [];
        if (view === 'calificaciones' && !dataCalificaciones.length) {
            container.innerHTML = '<p>No hay evaluaciones disponibles aún.</p>';
            return;
        }

        var activeData = view === 'calificaciones' ? dataCalificaciones : MOCK_EVALUACIONES_TIEMPO;

        if (view === 'calificaciones') {
            var contadoresTipo = {};
            activeData.forEach(function(d) {
                var letra = d.eval_type ? d.eval_type.charAt(0).toUpperCase() : 'E';
                if (!contadoresTipo[letra]) contadoresTipo[letra] = 0;
                contadoresTipo[letra]++;
                d.short_label = letra + contadoresTipo[letra]; 
            });
        }

        var margin = { top: 20, right: 20, bottom: 60, left: 60 };
        var height = 200;
        var parentWidth = container.parentElement.clientWidth || 800;
        var idealMinWidth = activeData.length * 70;
        var width = Math.max(parentWidth, idealMinWidth) - margin.left - margin.right;

        var svg = d3.select('#evaluaciones-chart').append('svg')
            .attr('width', width + margin.left + margin.right)
            .attr('height', height + margin.top + margin.bottom);

        var chart = svg.append('g').attr('transform', 'translate(' + margin.left + ',' + margin.top + ')');
        var x = d3.scaleBand().domain(activeData.map(function (d, i) { return i; })).range([0, width]).padding(0.3);

        var maxValue = view === 'tiempo' ? 4 : 100;
        var yAxisLabel = view === 'tiempo' ? 'TIEMPO (H)' : 'CALIFICACIÓN (%)';
        var y = d3.scaleLinear().domain([0, maxValue]).nice().range([height, 0]);

        // Ejes y Grilla
        chart.append('g').attr('class', 'grid').call(d3.axisLeft(y).ticks(5).tickSize(-width).tickFormat('')).selectAll('line').style('stroke', '#eef2f5').style('stroke-opacity', '0.7');
        chart.selectAll('.grid path').style('stroke-width', '0');
        chart.append('g').attr('class', 'chart-axis').call(d3.axisLeft(y).ticks(5));
        chart.append('g').attr('class', 'chart-axis').attr('transform', 'translate(0,' + height + ')').call(d3.axisBottom(x).tickFormat(function (i) { return activeData[i].short_label; }));
        chart.append('text').attr('transform', 'rotate(-90)').attr('y', -margin.left + 15).attr('x', -height / 2).attr('dy', '1em').style('text-anchor', 'middle').style('font-size', '11px').style('fill', '#666').text(yAxisLabel);

        function getEvalTooltipHtml(d) {
            var label = view === 'calificaciones' ? ((d.eval_type ? d.eval_type + ': ' : '') + d.name) : d.name;
            var valTu = view === 'calificaciones' ? d.score_user + '%' : d.time_user.toFixed(1) + ' hrs';
            var valMedia = view === 'calificaciones' ? d.score_median + '%' : d.median.toFixed(1) + ' hrs';
            return '<strong>' + label + '</strong><br>Tú: ' + valTu + '<br>Mediana del curso: ' + valMedia;
        }

        if (view === 'calificaciones') {
            chart.selectAll('.evaluaciones-bar').data(activeData).enter().append('rect')
                .attr('class', 'evaluaciones-bar').attr('x', function (d, i) { return x(i); })
                .attr('y', function (d) { return y(d.score_user); })
                .attr('width', x.bandwidth()).attr('height', function (d) { return height - y(d.score_user); }).attr('rx', 1).style('cursor', 'pointer')
                .on('mouseover touchstart', function(e, d) { showTooltip(e, getEvalTooltipHtml(d)); })
                .on('mousemove touchmove', moveTooltip)
                .on('mouseout touchend', hideTooltip);

            chart.selectAll('.chart-average').data(activeData).enter().append('rect')
                .attr('class', 'chart-average').attr('x', function (d, i) { return x(i) - 2; }).attr('y', function (d) { return y(d.score_median) - 3; })
                .attr('width', x.bandwidth() + 4).attr('height', 6).attr('rx', 2).style('pointer-events', 'none').attr('fill', '#5d5d5d');
                
        } else {
            var boxGroup = chart.selectAll('.box-group').data(activeData).enter().append('g').attr('class', 'box-group').style('cursor', 'pointer')
                .on('mouseover touchstart', function(e, d) { showTooltip(e, getEvalTooltipHtml(d)); })
                .on('mousemove touchmove', moveTooltip)
                .on('mouseout touchend', hideTooltip);

            boxGroup.append('line').attr('x1', function(d, i) { return x(i) + x.bandwidth() / 2; }).attr('x2', function(d, i) { return x(i) + x.bandwidth() / 2; }).attr('y1', function(d) { return y(d.min); }).attr('y2', function(d) { return y(d.q1); }).attr('stroke', '#7a7a7a').attr('stroke-width', 4);
            boxGroup.append('line').attr('x1', function(d, i) { return x(i) + x.bandwidth() / 2; }).attr('x2', function(d, i) { return x(i) + x.bandwidth() / 2; }).attr('y1', function(d) { return y(d.q3); }).attr('y2', function(d) { return y(d.max); }).attr('stroke', '#d9d9d9').attr('stroke-width', 4);
            boxGroup.append('rect').attr('x', function (d, i) { return x(i); }).attr('y', function (d) { return y(d.median); }).attr('width', x.bandwidth()).attr('height', function (d) { return y(d.q1) - y(d.median); }).attr('fill', '#7a7a7a');
            boxGroup.append('rect').attr('x', function (d, i) { return x(i); }).attr('y', function (d) { return y(d.q3); }).attr('width', x.bandwidth()).attr('height', function (d) { return y(d.median) - y(d.q3); }).attr('fill', '#d9d9d9');
            boxGroup.append('rect').attr('x', function (d, i) { return x(i); }).attr('y', function (d) { return y(d.time_user) - 3; }).attr('width', x.bandwidth()).attr('height', 6).attr('rx', 2).attr('fill', '#c67b9c');
        }
        applyRecommendationCollapse('rec-eval-content', 'rec-eval-toggle-btn');
    }

    // ==========================================
    // 7. Resto de eventos
    // ==========================================
    function setupToggles(d3) {
        var buttons = document.querySelectorAll('.chart-toggle .toggle-btn:not(#btn-view-porcentaje):not(#btn-view-tiempo)');
        buttons.forEach(function (button) {
            button.addEventListener('click', function () {
                var view = button.getAttribute('data-view');
                var target = button.getAttribute('data-target');
                
                if (target === 'completitud') currentCompletitudView = view;
                else if (target === 'navigation') currentNavigationView = view;
                else if (target === 'evaluaciones') currentEvaluacionesView = view;
                
                var groupButtons = document.querySelectorAll('.view-toggle-' + target + ' .toggle-btn');
                groupButtons.forEach(function (btn) { btn.classList.remove('active'); });
                button.classList.add('active');
                
                if (target === 'evaluaciones') renderEvaluacionesChart(d3, view);
                else renderChart(d3, target, view);
            });
        });
    }

    var resizeTimer;
    window.addEventListener('resize', function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function() {
            if (globalD3) {
                renderChart(globalD3, 'completitud', currentCompletitudView);
                renderChart(globalD3, 'navigation', currentNavigationView);
                renderEvaluacionesChart(globalD3, currentEvaluacionesView);
            }
        }, 250);
    });

})();
</script>
